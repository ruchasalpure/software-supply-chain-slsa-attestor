spec_version: "0.1.0"
name: software-supply-chain-slsa-attestor
version: 1.0.0
description: Generates cryptographically signed in-toto SLSA Level 4 provenance attestations and verifies cryptographic build pipeline isolation.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - slsa-provenance-verification
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - cybersecurity
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/software-supply-chain-slsa-attestor"
